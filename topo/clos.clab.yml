# Cilium Maglev × switch consistent-hashing lab — containerlab topology.
# Run from WSL2:  sudo containerlab deploy -t topo/clos.clab.yml
#
# Tiers (see docs/ADDRESSING.md):
#   client ── tor(SONiC) ──3x── spine1/2/3(FRR) ──mesh── leaf1/2(FRR) ──── node1/2/3 (k3s+bird+cilium)
#
# Only the ToR needs SONiC's consistent-hashing dataplane (the 3-way ECMP group that a spine
# failure shrinks). Spines/leaves are plain ECMP forwarders → FRR (lighter in WSL2).

name: maglev-clos

mgmt:
  network: maglev-mgmt
  ipv4-subnet: 172.30.0.0/24

topology:
  kinds:
    linux:
      # FRR switches and the client share the FRR image; nodes override below.
      image: quay.io/frrouting/frr:9.1.0

  nodes:
    # ---- ToR: forwarding switch (FRR, plain ECMP) -------------------------------------------
    # Note: originally planned as SONiC with FG_NHG consistent-hashing (resilient ECMP), but
    # sonic-vs's software ASIC bridging is incompatible with containerlab+native Docker on WSL2.
    # Using FRR instead; switch-CH is stated analytically in docs/APPENDIX-A-arista-mapping.md.
    # The Maglev on/off dimension is the primary experiment and is fully testable here.
    tor:
      kind: linux
      group: spine
      binds:
        - ../fabric/frr/tor.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons

    # ---- Spines (FRR) -----------------------------------------------------------------------
    spine1:
      kind: linux
      group: spine
      binds:
        - ../fabric/frr/spine1.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons
    spine2:
      kind: linux
      group: spine
      binds:
        - ../fabric/frr/spine2.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons
    spine3:
      kind: linux
      group: spine
      binds:
        - ../fabric/frr/spine3.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons

    # ---- Leaves (FRR) -----------------------------------------------------------------------
    leaf1:
      kind: linux
      group: leaf
      binds:
        - ../fabric/frr/leaf1.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons
    leaf2:
      kind: linux
      group: leaf
      binds:
        - ../fabric/frr/leaf2.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons

    # ---- Kubernetes nodes: k3s + host bird + Cilium -----------------------------------------
    # Built by nodes/Dockerfile (k3s + bird2 + tooling baked in).
    # containerlab runs all linux containers privileged by default — no explicit field needed.
    # ---- Kubernetes nodes: k3s + host bird + Cilium -----------------------------------------
    # Created manually by scripts/start-nodes.sh (--cgroupns=host, --privileged) BEFORE deploy.
    # containerlab uses ext-container to wire fabric veth links to the pre-existing containers.
    node1:
      kind: ext-container
    node2:
      kind: ext-container
    node3:
      kind: ext-container

    # ---- External client (FRR for BGP + flowgen mounted in) ---------------------------------
    client:
      kind: linux
      image: maglev/client:latest            # built by tests/lib/flowgen/Dockerfile (frr + flowgen)            # built by tests/lib/flowgen/Dockerfile (frr + flowgen)
      binds:
        - ../fabric/frr/client.conf:/etc/frr/frr.conf
        - ../fabric/frr/daemons:/etc/frr/daemons
        - ../nodes/startup/client.sh:/opt/startup.sh
      exec:
        - bash -lc "bash /opt/startup.sh >/var/log/startup.log 2>&1 &"

  links:
    # client ↔ tor
    - endpoints: ["client:eth1", "tor:eth1"]            # tor Ethernet0
    # tor ↔ spines
    - endpoints: ["tor:eth2", "spine1:eth1"]            # tor Ethernet4
    - endpoints: ["tor:eth3", "spine2:eth1"]            # tor Ethernet8
    - endpoints: ["tor:eth4", "spine3:eth1"]            # tor Ethernet12
    # spines ↔ leaves (full mesh)
    - endpoints: ["spine1:eth2", "leaf1:eth1"]
    - endpoints: ["spine1:eth3", "leaf2:eth1"]
    - endpoints: ["spine2:eth2", "leaf1:eth2"]
    - endpoints: ["spine2:eth3", "leaf2:eth2"]
    - endpoints: ["spine3:eth2", "leaf1:eth3"]
    - endpoints: ["spine3:eth3", "leaf2:eth3"]
    # leaves ↔ nodes (each node dual-homed: fab0→leaf1, fab1→leaf2)
    - endpoints: ["leaf1:eth4", "node1:fab0"]
    - endpoints: ["leaf1:eth5", "node2:fab0"]
    - endpoints: ["leaf1:eth6", "node3:fab0"]
    - endpoints: ["leaf2:eth4", "node1:fab1"]
    - endpoints: ["leaf2:eth5", "node2:fab1"]
    - endpoints: ["leaf2:eth6", "node3:fab1"]
