frr version 9.1
frr defaults datacenter
hostname leaf2
log stdout
!
! leaf2 — AS65012. Uplinks eth1→spine1, eth2→spine2, eth3→spine3.
! Downlinks eth4→node1.fab1, eth5→node2.fab1, eth6→node3.fab1.
!
interface lo
 ip address 10.255.2.2/32
!
interface eth1
 ip address 10.2.0.3/31
!
interface eth2
 ip address 10.2.0.7/31
!
interface eth3
 ip address 10.2.0.11/31
!
interface eth4
 ip address 10.3.2.0/31
!
interface eth5
 ip address 10.3.2.2/31
!
interface eth6
 ip address 10.3.2.4/31
!
router bgp 65012
 bgp router-id 10.255.2.2
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.2.0.2 remote-as 65001
 neighbor 10.2.0.6 remote-as 65002
 neighbor 10.2.0.10 remote-as 65003
 neighbor 10.3.2.1 remote-as 65021
 neighbor 10.3.2.3 remote-as 65022
 neighbor 10.3.2.5 remote-as 65023
 ! node-facing sessions: 30/90 to mirror prod (no BFD, no explicit GR). 'frr defaults
 ! datacenter' would otherwise give 3/9, and the lower hold wins in negotiation.
 neighbor 10.3.2.1 timers 30 90
 neighbor 10.3.2.3 timers 30 90
 neighbor 10.3.2.5 timers 30 90
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.2.0.2 activate
  neighbor 10.2.0.6 activate
  neighbor 10.2.0.10 activate
  neighbor 10.3.2.1 activate
  neighbor 10.3.2.3 activate
  neighbor 10.3.2.5 activate
 exit-address-family
!
