frr version 9.1
frr defaults datacenter
hostname client
log stdout
!
! client — AS65100 — single eBGP session to the ToR.
! Advertises its source loopback (203.0.113.1) so the fabric can return traffic;
! learns the Service VIP (192.0.2.10) via the ToR.
!
interface lo
 ip address 203.0.113.1/32
!
interface eth1
 ip address 10.0.0.0/31      ! ↔ tor
!
router bgp 65100
 bgp router-id 203.0.113.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65000       ! tor
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.0.0.1 activate
 exit-address-family
!
