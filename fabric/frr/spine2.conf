frr version 9.1
frr defaults datacenter
hostname spine2
log stdout
!
! spine2 — AS65002 — see docs/ADDRESSING.md
!
interface lo
 ip address 10.255.1.2/32
!
interface eth1
 ip address 10.1.1.3/31      ! ↔ tor
interface eth2
 ip address 10.2.0.4/31      ! ↔ leaf1
interface eth3
 ip address 10.2.0.6/31      ! ↔ leaf2
!
router bgp 65002
 bgp router-id 10.255.1.2
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.1.1.2 remote-as 65000      ! tor
 neighbor 10.2.0.5 remote-as 65011      ! leaf1
 neighbor 10.2.0.7 remote-as 65012      ! leaf2
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.1.1.2 activate
  neighbor 10.2.0.5 activate
  neighbor 10.2.0.7 activate
 exit-address-family
!
