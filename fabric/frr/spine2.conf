frr version 9.1
frr defaults datacenter
hostname spine2
log stdout
!
! spine2 — AS65002. Links: eth1→tor, eth2→leaf1, eth3→leaf2
!
interface lo
 ip address 10.255.1.2/32
!
interface eth1
 ip address 10.1.1.3/31
!
interface eth2
 ip address 10.2.0.4/31
!
interface eth3
 ip address 10.2.0.6/31
!
router bgp 65002
 bgp router-id 10.255.1.2
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.1.1.2 remote-as 65000
 neighbor 10.2.0.5 remote-as 65011
 neighbor 10.2.0.7 remote-as 65012
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.1.1.2 activate
  neighbor 10.2.0.5 activate
  neighbor 10.2.0.7 activate
 exit-address-family
!
