frr version 9.1
frr defaults datacenter
hostname leaf1
log stdout
!
! leaf1 — AS65011. Uplinks eth1→spine1, eth2→spine2, eth3→spine3.
! Downlinks eth4→node1.fab0, eth5→node2.fab0, eth6→node3.fab0.
!
interface lo
 ip address 10.255.2.1/32
!
interface eth1
 ip address 10.2.0.1/31
!
interface eth2
 ip address 10.2.0.5/31
!
interface eth3
 ip address 10.2.0.9/31
!
interface eth4
 ip address 10.3.1.0/31
!
interface eth5
 ip address 10.3.1.2/31
!
interface eth6
 ip address 10.3.1.4/31
!
router bgp 65011
 bgp router-id 10.255.2.1
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.2.0.0 remote-as 65001
 neighbor 10.2.0.4 remote-as 65002
 neighbor 10.2.0.8 remote-as 65003
 neighbor 10.3.1.1 remote-as 65021
 neighbor 10.3.1.3 remote-as 65022
 neighbor 10.3.1.5 remote-as 65023
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.2.0.0 activate
  neighbor 10.2.0.4 activate
  neighbor 10.2.0.8 activate
  neighbor 10.3.1.1 activate
  neighbor 10.3.1.3 activate
  neighbor 10.3.1.5 activate
 exit-address-family
!
