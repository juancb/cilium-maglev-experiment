frr version 9.1
frr defaults datacenter
hostname spine3
log stdout
!
! spine3 — AS65003 — see docs/ADDRESSING.md
!
interface lo
 ip address 10.255.1.3/32
!
interface eth1
 ip address 10.1.1.5/31      ! ↔ tor
interface eth2
 ip address 10.2.0.8/31      ! ↔ leaf1
interface eth3
 ip address 10.2.0.10/31     ! ↔ leaf2
!
router bgp 65003
 bgp router-id 10.255.1.3
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.1.1.4 remote-as 65000      ! tor
 neighbor 10.2.0.9 remote-as 65011      ! leaf1
 neighbor 10.2.0.11 remote-as 65012     ! leaf2
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.1.1.4 activate
  neighbor 10.2.0.9 activate
  neighbor 10.2.0.11 activate
 exit-address-family
!
