frr version 9.1
frr defaults datacenter
hostname spine3
log stdout
!
! spine3 — AS65003. Links: eth1→tor, eth2→leaf1, eth3→leaf2
!
interface lo
 ip address 10.255.1.3/32
!
interface eth1
 ip address 10.1.1.5/31
!
interface eth2
 ip address 10.2.0.8/31
!
interface eth3
 ip address 10.2.0.10/31
!
router bgp 65003
 bgp router-id 10.255.1.3
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.1.1.4 remote-as 65000
 neighbor 10.2.0.9 remote-as 65011
 neighbor 10.2.0.11 remote-as 65012
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.1.1.4 activate
  neighbor 10.2.0.9 activate
  neighbor 10.2.0.11 activate
 exit-address-family
!
