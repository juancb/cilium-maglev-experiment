frr version 9.1
frr defaults datacenter
hostname spine1
log stdout
!
! spine1 — AS65001. Links: eth1→tor, eth2→leaf1, eth3→leaf2
! See docs/ADDRESSING.md for full address plan.
!
interface lo
 ip address 10.255.1.1/32
!
! eth1: 10.1.1.0/31 to tor (a=tor, b=spine1)
interface eth1
 ip address 10.1.1.1/31
!
! eth2: 10.2.0.0/31 to leaf1
interface eth2
 ip address 10.2.0.0/31
!
! eth3: 10.2.0.2/31 to leaf2
interface eth3
 ip address 10.2.0.2/31
!
router bgp 65001
 bgp router-id 10.255.1.1
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 ! tor
 neighbor 10.1.1.0 remote-as 65000
 ! leaf1
 neighbor 10.2.0.1 remote-as 65011
 ! leaf2
 neighbor 10.2.0.3 remote-as 65012
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.1.1.0 activate
  neighbor 10.2.0.1 activate
  neighbor 10.2.0.3 activate
 exit-address-family
!
