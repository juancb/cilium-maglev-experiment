frr version 9.1
frr defaults datacenter
hostname tor
log stdout
!
! ToR — AS65000. Peers: client (AS65100, eth1), spine1/2/3 (AS65001-3, eth2-4).
! eth1: 10.0.0.1/31 (client), eth2: 10.1.1.0/31 (spine1),
! eth3: 10.1.1.2/31 (spine2), eth4: 10.1.1.4/31 (spine3).
! Note: FRR does per-flow hashing but NOT resilient ECMP (consistent hashing).
! The Maglev vs no-Maglev comparison is the primary experiment and fully testable here.
! Resilient ECMP (switch-CH lever) is documented analytically in docs/APPENDIX-A.
!
interface lo
 ip address 10.255.0.0/32
!
interface eth1
 ip address 10.0.0.1/31
!
interface eth2
 ip address 10.1.1.0/31
!
interface eth3
 ip address 10.1.1.2/31
!
interface eth4
 ip address 10.1.1.4/31
!
router bgp 65000
 bgp router-id 10.255.0.0
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor 10.0.0.0 remote-as 65100
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.3 remote-as 65002
 neighbor 10.1.1.5 remote-as 65003
 !
 address-family ipv4 unicast
  redistribute connected
  maximum-paths 8
  neighbor 10.0.0.0 activate
  neighbor 10.1.1.1 activate
  neighbor 10.1.1.3 activate
  neighbor 10.1.1.5 activate
 exit-address-family
!
