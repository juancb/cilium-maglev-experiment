# Cilium BGP control plane (v2) — each node's Cilium peers ITS OWN host bird.
#
# Cilium dials bird's public IP (198.51.100.X) from the k8s interface (10.10.0.X).
# bird listens passively with neighbor range 10.10.0.0/24; multihop bypasses bird's
# direct-connectivity check for same-host eBGP sessions.
#
# Per-node ASNs (Cilium 6503x ↔ bird 6502x) require one CiliumBGPClusterConfig per
# node. They share one PeerConfig (timers/families) and one Advertisement (VIP + PodCIDR).
# bird re-advertises these out fab0/fab1 to the leaves.
#
# Nodes MUST keep distinct ASNs: a shared node ASN would make BGP loop-prevention drop
# cross-node pod-CIDR routes, breaking native pod-to-pod routing through the fabric.
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: vip-pool
spec:
  blocks:
    - cidr: 192.0.2.0/24      # Service VIP 192.0.2.10 is allocated from here
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: bird-peer
spec:
  # Mirrors prod: 90s hold, no BFD, and graceful restart left at the Cilium default
  # (disabled). Without GR, an agent restart closes the session and bird withdraws every
  # route Cilium originated (pod CIDR, Cilium-only VIPs) until the new agent re-peers.
  # tests/05-cilium-disruption.sh measures exactly that window.
  timers:
    connectRetryTimeSeconds: 1
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
  transport:
    peerPort: 179
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: vip-and-pods
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          app: echo
    - advertisementType: PodCIDR
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: node1-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: node1
  bgpInstances:
    - name: "cilium-65031"
      localASN: 65031
      peers:
        - name: "bird-local"
          peerASN: 65021
          peerAddress: 198.51.100.1
          peerConfigRef:
            name: bird-peer
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: node2-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: node2
  bgpInstances:
    - name: "cilium-65032"
      localASN: 65032
      peers:
        - name: "bird-local"
          peerASN: 65022
          peerAddress: 198.51.100.2
          peerConfigRef:
            name: bird-peer
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: node3-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: node3
  bgpInstances:
    - name: "cilium-65033"
      localASN: 65033
      peers:
        - name: "bird-local"
          peerASN: 65023
          peerAddress: 198.51.100.3
          peerConfigRef:
            name: bird-peer
