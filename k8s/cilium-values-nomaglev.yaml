# Cilium Helm values — NO-MAGLEV variant (control for the 2×2).
# Identical to cilium-values-maglev.yaml except loadBalancer.algorithm = random, so backend
# selection is NOT consistent across nodes — a flow re-homed to a different ingress node
# recomputes a (likely different) backend and the TCP connection resets.
#
# Apply:  helm upgrade cilium cilium/cilium -n kube-system -f k8s/cilium-values-nomaglev.yaml \
#           && kubectl -n kube-system rollout restart ds/cilium

kubeProxyReplacement: true
k8sServiceHost: 10.10.0.1
k8sServicePort: 6443

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
autoDirectNodeRoutes: false
endpointRoutes:
  enabled: true

bpf:
  masquerade: true

socketLB:
  hostNamespaceOnly: true

devices: [eth0, k8s, fab0, fab1]

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
    clusterPoolIPv4MaskSize: 24

# ---- the knob under test -----------------------------------------------------------------
loadBalancer:
  algorithm: random                # NON-consistent: per-node backend choice diverges
  mode: snat
# ------------------------------------------------------------------------------------------

bgpControlPlane:
  enabled: true

operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
