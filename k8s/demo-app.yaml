# Demo backend + LoadBalancer service for the failover experiment.
#
# The server sends "POD=<name>\n" on connect, then echoes — so flowgen can record which backend
# served each long-lived TCP connection and detect resets. Service is type LoadBalancer with a
# fixed VIP and externalTrafficPolicy=Cluster (so any ingress node forwards to any backend,
# which is exactly what exercises cross-node Maglev backend selection).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-server
  namespace: default
data:
  server.py: |
    import os, socket, threading
    name = os.environ.get("POD_NAME", "?")
    srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    srv.bind(("0.0.0.0", 8080)); srv.listen(2048)
    def handle(c):
        try:
            c.sendall(("POD=%s\n" % name).encode())
            while True:
                d = c.recv(1024)
                if not d: break
                c.sendall(d)          # echo keepalives to hold the flow open
        except Exception:
            pass
        finally:
            c.close()
    while True:
        conn, _ = srv.accept()
        threading.Thread(target=handle, args=(conn,), daemon=True).start()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
  labels: { app: echo }
spec:
  replicas: 6                       # B backends; sweep overrides this
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      # Backends must NOT run on node2 (the node we fail in Test 3).
      # If backends were on node2, they'd die with the node, making all
      # node2-ingressed flows fail regardless of Maglev/random.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: echo }
      containers:
        - name: echo
          image: python:3.12-slim
          command: ["python3", "/srv/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: src
              mountPath: /srv
      volumes:
        - name: src
          configMap:
            name: echo-server
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: default
  labels: { app: echo }
spec:
  type: LoadBalancer
  loadBalancerIP: 192.0.2.10
  externalTrafficPolicy: Cluster
  selector:
    app: echo
  ports:
    - name: tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
