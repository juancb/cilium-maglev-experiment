# Demo backend + LoadBalancer service for Test 4A (ETP=Local).
#
# 3 replicas with required 1-per-node spread so each node has exactly one local backend.
# ETP=Local means: each ingress node only forwards to its OWN local backend pod.
# When node2 fails, ~1/3 of flows re-home but always land on a different local pod
# → 100% of re-homed flows break regardless of Maglev/random → ~33% total broken.
# This proves Maglev is irrelevant under ETP=Local: both cells show ~33%.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-server
  namespace: default
data:
  server.py: |
    import os, socket, threading
    name = os.environ.get("POD_NAME", "?")
    srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    srv.bind(("0.0.0.0", 8080)); srv.listen(2048)
    def handle(c):
        try:
            c.sendall(("POD=%s\n" % name).encode())
            while True:
                d = c.recv(1024)
                if not d: break
                c.sendall(d)
        except Exception:
            pass
        finally:
            c.close()
    while True:
        conn, _ = srv.accept()
        threading.Thread(target=handle, args=(conn,), daemon=True).start()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
  labels: { app: echo }
spec:
  replicas: 3                       # exactly 1 per node (required spread below)
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule   # required spread: 1 per node, no bunching
          labelSelector:
            matchLabels: { app: echo }
      containers:
        - name: echo
          image: python:3.12-slim
          command: ["python3", "/srv/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: src
              mountPath: /srv
      volumes:
        - name: src
          configMap:
            name: echo-server
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: default
  labels: { app: echo }
spec:
  type: LoadBalancer
  loadBalancerIP: 192.0.2.10
  externalTrafficPolicy: Local       # each node only serves its own local backend
  selector:
    app: echo
  ports:
    - name: tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
