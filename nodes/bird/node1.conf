# bird 2.x — node1 host BGP (AS65021). See docs/ADDRESSING.md.
# Owns the two fabric uplink sessions (fab0→leaf1, fab1→leaf2) and a local session to the
# Cilium agent. Cilium originates the Service VIP + pod CIDR; bird re-advertises them to
# the fabric and installs learned routes as kernel multipath (host ECMP).
#
# Cilium dials out to bird:179; bird is passive on the cilium session.
# neighbor range accepts connections from any source in the node's k8s subnet so that
# Cilium's dynamically-chosen source IP doesn't need to match exactly.

log syslog all;
router id 10.255.3.1;

# VIP only — pod CIDR is now originated by Cilium BGP directly.
protocol static vip {
  ipv4;
  route 192.0.2.10/32 via "k8s";
  route 192.0.2.11/32 via "k8s";  # paired-test maglev VIP
  route 192.0.2.12/32 via "k8s";  # paired-test random VIP
  route 192.0.2.13/32 via "k8s";  # matrix maglev+snat VIP
  route 192.0.2.14/32 via "k8s";  # matrix random+snat VIP
  route 192.0.2.21/32 via "k8s";  # disruption test: bird-static VIP (.20 is Cilium-originated only)
}

protocol device { scan time 10; }

# connected routes for the named interfaces (gives us public/k8s /32s in bird's table)
protocol direct {
  ipv4;
  interface "fab0", "fab1", "public", "k8s";
}

# install learned fabric routes into the kernel FIB as ECMP; do not export the VIP back to
# the kernel (inbound VIP packets are handled by Cilium BPF at ingress).
protocol kernel {
  merge paths on;
  ipv4 {
    import none;
    export filter {
      if net ~ [ 192.0.2.0/24+ ] then reject;
      accept;
    };
  };
}

# only these prefixes leave this node toward the fabric
filter to_fabric {
  if net = 198.51.100.1/32 then accept;   # public
  if net = 10.10.0.1/32    then accept;   # k8s InternalIP
  if net ~ [ 10.244.0.0/16+ ] then accept; # pod CIDR (from Cilium BGP session)
  if net ~ [ 192.0.2.0/24+ ] then accept;  # Service VIP pool
  reject;
}

protocol bgp uplink0 {
  description "to leaf1 via fab0";
  local 10.3.1.1 as 65021;
  neighbor 10.3.1.0 as 65011;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  ipv4 { import all; export filter to_fabric; };
}

protocol bgp uplink1 {
  description "to leaf2 via fab1";
  local 10.3.2.1 as 65021;
  neighbor 10.3.2.0 as 65012;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  ipv4 { import all; export filter to_fabric; };
}

protocol bgp cilium {
  description "local Cilium agent originates VIP + pod CIDR";
  debug all;
  local 198.51.100.1 as 65021;
  neighbor range 0.0.0.0/0 as 65031;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  passive on;
  multihop;
  error wait time 1, 1;
  error forget time 10;
  ipv4 { import all; export none; };
}
