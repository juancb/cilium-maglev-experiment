# bird 2.x — node2 host BGP (AS65022). See docs/ADDRESSING.md.

log syslog all;
# tests/05 CAPTURE_BGP=1 reads this; the cilium protocol has `debug all`, so every
# UPDATE, withdraw and End-of-RIB from the agent is logged here.
log "/var/log/bird.log" all;
router id 10.255.3.2;

# VIP only — pod CIDR is now originated by Cilium BGP directly.
protocol static vip {
  ipv4;
  route 192.0.2.10/32 via "k8s";
  route 192.0.2.11/32 via "k8s";  # paired-test maglev VIP
  route 192.0.2.12/32 via "k8s";  # paired-test random VIP
  route 192.0.2.13/32 via "k8s";  # matrix maglev+snat VIP
  route 192.0.2.14/32 via "k8s";  # matrix random+snat VIP
  route 192.0.2.21/32 via "k8s";  # disruption test: bird-static VIP (.20 is Cilium-originated only)
}

protocol device { scan time 10; }

protocol direct {
  ipv4;
  interface "fab0", "fab1", "public", "k8s";
}

protocol kernel {
  merge paths on;
  ipv4 {
    import none;
    export filter {
      if net ~ [ 192.0.2.0/24+ ] then reject;
      accept;
    };
  };
}

filter to_fabric {
  # a node is a server, never transit: don't re-export what one leaf taught us to the other
  if proto ~ "uplink*" then reject;
  if net = 198.51.100.2/32 then accept;   # public
  if net = 10.10.0.2/32    then accept;   # k8s InternalIP
  if net ~ [ 10.244.0.0/16+ ] then accept; # pod CIDR (from Cilium BGP session)
  if net ~ [ 192.0.2.0/24+ ] then accept;  # Service VIP pool
  reject;
}

protocol bgp uplink0 {
  description "to leaf1 via fab0";
  local 10.3.1.3 as 65022;
  neighbor 10.3.1.2 as 65011;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  ipv4 { import all; export filter to_fabric; };
}

protocol bgp uplink1 {
  description "to leaf2 via fab1";
  local 10.3.2.3 as 65022;
  neighbor 10.3.2.2 as 65012;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  ipv4 { import all; export filter to_fabric; };
}

protocol bgp cilium {
  description "local Cilium agent originates VIP + pod CIDR";
  debug all;
  local 198.51.100.2 as 65022;
  neighbor range 0.0.0.0/0 as 65032;
  # Prod mirror: no BFD, no explicit graceful restart (bird default = GR 'aware', i.e.
  # helper only). 90s hold, so a silent peer failure is detected only by the hold timer.
  hold time 90;
  keepalive time 30;
  passive on;
  multihop;
  error wait time 1, 1;
  error forget time 10;
  # Cilium's next hop is this node's own public IP, which bird can't resolve, so its routes
  # land as "unreachable" and lose best-path to any reachable copy learned from the fabric.
  # For a VIP another node already advertises, bird then prefers the fabric copy and this
  # node stops originating it (only one ECMP nexthop, cluster-wide). Pin Cilium's VIPs to
  # the k8s interface, as the static VIPs are; kernel export drops 192.0.2.0/24 anyway.
  ipv4 {
    import filter {
      if net ~ [ 192.0.2.0/24+ ] then ifname = "k8s";
      accept;
    };
    export none;
  };
}
